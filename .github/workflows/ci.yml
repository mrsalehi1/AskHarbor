name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askharbor
          POSTGRES_PASSWORD: askharbor
          POSTGRES_DB: askharbor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askharbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASKHARBOR_TEST_DATABASE_URL: postgresql+psycopg://askharbor:askharbor@127.0.0.1:5432/askharbor_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .

  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2 --minWorkers=1
      - run: npm run typecheck
      - run: npm run build
