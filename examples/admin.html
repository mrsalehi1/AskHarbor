<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>AskHarbor panel</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #17233b; background: #f3f6fb; }
      body { margin: 0; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      h2 { font-size: 1rem; margin: 1rem 0 .5rem; }
      .hint { font-size: .85rem; color: #475467; margin: .5rem 0 0; }
      .card { background: #fff; border: 1px solid #e4e9f2; border-radius: .75rem; padding: 1.25rem; }
      .centered { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
      .login { width: min(26rem, 100%); }
      .field { display: grid; gap: .25rem; margin: .75rem 0; }
      .field label { font-size: .85rem; font-weight: 600; color: #344054; }
      .field.checkbox label { font-weight: 500; }
      input, textarea, select { font: inherit; padding: .45rem .6rem; border: 1px solid #cbd5e4; border-radius: .5rem; background: #fff; }
      input[readonly] { background: #f2f4f7; color: #475467; }
      textarea { resize: vertical; }
      button, .button { font: inherit; padding: .4rem .8rem; border-radius: .5rem; border: 1px solid #cbd5e4; background: #fff; cursor: pointer; text-decoration: none; color: inherit; display: inline-block; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button.primary, .button, #export-button, #save-button { background: #155eef; border-color: #155eef; color: #fff; font-weight: 600; }
      button.link { border: 0; background: none; color: #155eef; padding: .25rem 0; }
      button.danger { color: #b42318; border-color: #f4b8b1; }
      .notice { margin: .5rem 0 0; padding: .5rem .75rem; border-radius: .5rem; font-size: .9rem; }
      .notice.ok { background: #ecfdf3; color: #067647; }
      .notice.error { background: #fef3f2; color: #b42318; }
      .shell { display: grid; grid-template-columns: 16rem minmax(0, 1fr); min-height: 100vh; }
      .sidebar { background: #fff; border-right: 1px solid #e4e9f2; padding: 1rem; display: flex; flex-direction: column; gap: .25rem; }
      .sidebar .brand { font-weight: 800; color: #155eef; margin: 0; }
      .sidebar .who { margin: 0 0 .5rem; font-size: .85rem; color: #475467; }
      .sidebar h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #667085; margin: 1rem 0 .25rem; }
      .nav-item { text-align: left; border: 0; background: none; padding: .45rem .6rem; border-radius: .5rem; }
      .nav-item:hover { background: #f2f4f7; }
      .nav-item.active { background: #eff4ff; color: #1849a9; font-weight: 600; }
      .nav-footer { margin-top: auto; display: grid; gap: .25rem; padding-top: 1rem; border-top: 1px solid #e4e9f2; }
      .main { padding: 1.25rem 1.5rem 3rem; min-width: 0; }
      .page-header { margin-bottom: .75rem; }
      .tabs { display: flex; gap: .25rem; border-bottom: 1px solid #e4e9f2; margin-bottom: 1rem; flex-wrap: wrap; }
      .tab { border: 0; background: none; padding: .6rem .8rem; border-bottom: 2px solid transparent; border-radius: 0; }
      .tab.active { border-bottom-color: #155eef; color: #1849a9; font-weight: 600; }
      .table { width: 100%; border-collapse: collapse; background: #fff; border-radius: .75rem; overflow: hidden; border: 1px solid #e4e9f2; font-size: .9rem; }
      .table th, .table td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid #eef2f6; vertical-align: top; }
      .table th { background: #f8fafc; font-weight: 600; }
      .actions button { margin: 0 .25rem .25rem 0; font-size: .85rem; padding: .25rem .6rem; }
      .chip { display: inline-flex; align-items: center; gap: .25rem; background: #eff4ff; color: #1849a9; border-radius: 999px; padding: .1rem .3rem .1rem .6rem; margin: 0 .25rem .25rem 0; font-size: .85rem; }
      .chip button { border: 0; background: none; padding: 0 .3rem; font-size: 1rem; line-height: 1; }
      .inline-form { margin-top: 1.5rem; max-width: 30rem; }
      #embed-snippet { background: #0b1220; color: #e6edf7; padding: 1rem; border-radius: .5rem; overflow-x: auto; font-size: .85rem; }
      /* Editor layout, same as editor.html */
      .editor-root { display: grid; grid-template-areas: "toolbar toolbar" "form side"; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1rem; align-items: start; }
      .editor-root .toolbar { grid-area: toolbar; background: #fff; border-radius: .75rem; padding: .75rem 1rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; border: 1px solid #e4e9f2; }
      .editor-root .toolbar .import-label { font-weight: 600; }
      #bot-form { grid-area: form; display: grid; gap: 1rem; }
      .editor-root .side { grid-area: side; display: grid; gap: 1rem; position: sticky; top: 1rem; }
      fieldset, .problems, .preview { background: #fff; border: 1px solid #e4e9f2; border-radius: .75rem; padding: 1rem; margin: 0; }
      legend, .problems h2, .preview h2 { font-size: 1rem; font-weight: 700; padding: 0 .25rem; margin: 0; }
      .field-invalid { border-color: #d92d20; outline: 1px solid #d92d20; }
      .id-row { display: flex; gap: .4rem; margin: .35rem 0; align-items: center; }
      .id-row select { flex: 1; min-width: 0; }
      .id-list .add, #add-answer, .remove-answer { margin-top: .5rem; }
      #problem-list { margin: .5rem 0 0; padding-left: 1.25rem; color: #b42318; font-size: .9rem; }
      #no-problems { color: #067647; margin: .5rem 0 0; font-size: .9rem; }
      #preview-note, #import-status, #save-status { font-size: .9rem; color: #475467; }
      #import-status .import-error { color: #b42318; font-weight: 600; margin: 0; }
      #import-status ul { margin: .25rem 0 0; padding-left: 1.25rem; color: #b42318; }
      :focus-visible { outline: 3px solid #155eef; outline-offset: 2px; }
      @media (max-width: 900px) {
        .shell { grid-template-columns: 1fr; }
        .editor-root { grid-template-areas: "toolbar" "side" "form"; grid-template-columns: 1fr; }
        .editor-root .side { position: static; }
      }
    </style>
  </head>
  <body>
    <div id="askharbor-admin"></div>
    <script src="./admin.js" defer></script>
  </body>
</html>
